services:
  app:
    volumes:
      # Production: mount hanya storage, bukan seluruh project (lebih aman)
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
      - storage_public:/var/www/html/storage/app/public

  nginx:
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # phpMyAdmin TIDAK dijalankan di production (risiko keamanan)
  phpmyadmin:
    profiles:
      - tools

  db:
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bpkad_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bpkad_net
    depends_on:
      - nginx

volumes:
  storage_logs:
    driver: local
  storage_framework:
    driver: local
